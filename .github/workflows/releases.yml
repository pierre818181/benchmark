name: Releases

on:
  push:
    tags:
      - v*.*.*

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build regular using Dockerfile
        uses: depot/build-push-action@v1
        if: ${{ endsWith(github.ref_name, '-regular') }}
        with:
          token: ${{ secrets.DEPOT_TOKEN }}
          tags: pierre781/benchmark:latest
          push: true
          project: 9w1m5vwn12
      
      - name: Build H100s using Dockerfile
        if: ${{ endsWith(github.ref_name, '-h100s') }}
        uses: depot/build-push-action@v1
        with:
          token: ${{ secrets.DEPOT_TOKEN }}
          tags: pierre781/benchmark:H100
          push: true
          project: 9w1m5vwn12
